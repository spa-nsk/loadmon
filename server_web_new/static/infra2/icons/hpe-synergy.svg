<svg viewBox="0 0 200 170" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sbody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eef7f4"/><stop offset="100%" stop-color="#c9dfd8"/>
    </linearGradient>
    <linearGradient id="scompute" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3d42"/><stop offset="100%" stop-color="#1c1d20"/>
    </linearGradient>
    <linearGradient id="sinterconnect" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#02c99a"/><stop offset="100%" stop-color="#017a5c"/>
    </linearGradient>
  </defs>
  <rect x="6" y="6" width="188" height="158" rx="8" fill="url(#sbody)" stroke="#8fb8ac" stroke-width="1.5"/>
  <rect x="6" y="6" width="188" height="22" rx="8" fill="#01A982"/>
  <text x="100" y="21" font-family="Arial, sans-serif" font-size="12" fill="#fff" text-anchor="middle" font-weight="bold">HPE Synergy 12000</text>

  <!-- 3 compute modules -->
  <g transform="translate(16,34)">
    <rect width="52" height="76" rx="3" fill="url(#scompute)"/>
    <circle cx="26" cy="66" r="3" fill="#02c99a"/>
    <text x="26" y="20" font-family="Arial" font-size="8" fill="#cfe8f5" text-anchor="middle">Compute</text>
  </g>
  <g transform="translate(74,34)">
    <rect width="52" height="76" rx="3" fill="url(#scompute)"/>
    <circle cx="26" cy="66" r="3" fill="#02c99a"/>
    <text x="26" y="20" font-family="Arial" font-size="8" fill="#cfe8f5" text-anchor="middle">Compute</text>
  </g>
  <g transform="translate(132,34)">
    <rect width="52" height="76" rx="3" fill="url(#scompute)"/>
    <circle cx="26" cy="66" r="3" fill="#02c99a"/>
    <text x="26" y="20" font-family="Arial" font-size="8" fill="#cfe8f5" text-anchor="middle">Compute</text>
  </g>

  <!-- interconnect / composer module -->
  <rect x="16" y="116" width="168" height="30" rx="4" fill="url(#sinterconnect)"/>
  <text x="100" y="135" font-family="Arial, sans-serif" font-size="10" fill="#fff" text-anchor="middle" font-weight="bold">Synergy Composer / Interconnect</text>

  <rect x="16" y="150" width="168" height="10" rx="3" fill="#8fb8ac"/>
