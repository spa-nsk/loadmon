<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 500" width="420" height="500">
  <title>Складской стеллаж (вид спереди)</title>
  <defs>
    <linearGradient id="post" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#46607c"/><stop offset="0.5" stop-color="#34495f"/><stop offset="1" stop-color="#222f3f"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#4a6482"/><stop offset="0.35" stop-color="#34495f"/><stop offset="1" stop-color="#1d2a38"/>
    </linearGradient>
    <linearGradient id="deck" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#59636f"/><stop offset="1" stop-color="#3b434d"/>
    </linearGradient>
    <g id="post-slots" fill="#0a0d12">
      <rect x="9" y="30" width="6" height="12" rx="2"/><rect x="9" y="58" width="6" height="12" rx="2"/>
      <rect x="9" y="86" width="6" height="12" rx="2"/><rect x="9" y="114" width="6" height="12" rx="2"/>
      <rect x="9" y="142" width="6" height="12" rx="2"/><rect x="9" y="170" width="6" height="12" rx="2"/>
      <rect x="9" y="198" width="6" height="12" rx="2"/><rect x="9" y="226" width="6" height="12" rx="2"/>
      <rect x="9" y="254" width="6" height="12" rx="2"/><rect x="9" y="282" width="6" height="12" rx="2"/>
      <rect x="9" y="310" width="6" height="12" rx="2"/><rect x="9" y="338" width="6" height="12" rx="2"/>
      <rect x="9" y="366" width="6" height="12" rx="2"/><rect x="9" y="394" width="6" height="12" rx="2"/>
      <rect x="9" y="422" width="6" height="12" rx="2"/><rect x="9" y="450" width="6" height="12" rx="2"/>
    </g>
  </defs>
  <!-- задняя стенка и диагональные связи -->
  <rect x="24" y="14" width="372" height="460" fill="#0b0e13"/>
  <g stroke="#465c76" stroke-opacity="0.55" stroke-width="3" fill="none">
    <path d="M24 458 L396 372"/><path d="M24 346 L396 260"/><path d="M24 234 L396 148"/><path d="M24 122 L396 36"/>
  </g>
  <!-- стойки -->
  <rect x="0" y="0" width="24" height="474" fill="url(#post)"/>
  <rect x="1" y="0" width="1.5" height="474" fill="#ffffff" fill-opacity="0.18"/>
  <use href="#post-slots"/>
  <rect x="396" y="0" width="24" height="474" fill="url(#post)"/>
  <rect x="397" y="0" width="1.5" height="474" fill="#ffffff" fill-opacity="0.18"/>
  <use href="#post-slots" x="396"/>
  <rect x="-2" y="474" width="28" height="12" rx="2" fill="#161b22"/>
  <rect x="394" y="474" width="28" height="12" rx="2" fill="#161b22"/>
  <!-- настил и передние балки (4 яруса) -->
  <g>
    <rect x="24" y="428" width="372" height="8" fill="url(#deck)"/><rect x="24" y="436" width="372" height="22" fill="url(#beam)"/>
    <rect x="24" y="316" width="372" height="8" fill="url(#deck)"/><rect x="24" y="324" width="372" height="22" fill="url(#beam)"/>
    <rect x="24" y="204" width="372" height="8" fill="url(#deck)"/><rect x="24" y="212" width="372" height="22" fill="url(#beam)"/>
    <rect x="24" y="92" width="372" height="8" fill="url(#deck)"/><rect x="24" y="100" width="372" height="22" fill="url(#beam)"/>
    <rect x="24" y="14" width="372" height="22" fill="url(#beam)"/>
  </g>
  <g fill="#ffffff" fill-opacity="0.22">
    <rect x="24" y="436" width="372" height="1"/><rect x="24" y="324" width="372" height="1"/>
    <rect x="24" y="212" width="372" height="1"/><rect x="24" y="100" width="372" height="1"/><rect x="24" y="14" width="372" height="1"/>
  </g>
</svg>
