appname = "loadmon"
ServerName = "LoadMon"
httpport = 9001
runmode = dev

# Каталог с файлами *.sql для режима "Выгрузка по View" (/admin/viewexport,
# см. controllers/adminviewexport.go). Путь относителен рабочей директории
# процесса, как и "./reports" для XLSX/CSV-выгрузок. Если ключ не задан,
# используется значение по умолчанию "./conf/viewsql" (см. viewExportSQLDir).
viewsqldir = "./conf/viewsql"
# Каталог с yaml описаниями для импорта данных
yaml="./conf/yaml"
# Белый список режимов "Выгрузка по View" - пары "имя:Заголовок" через
# запятую. "имя" - это одновременно значение :name в маршруте
# /admin/viewexport/:name и имя файла запроса <viewsqldir>/<имя>.sql (без
# расширения). Чтобы добавить новый режим - допишите пару сюда и создайте
# одноимённый файл .sql в каталоге viewsqldir; код контроллера/шаблонов
# трогать не нужно. Если ключ не задан или пуст - используется запасной
# список из controllers/adminviewexport.go:viewExportModesDefault.
viewexportmodes = "server-hw:Аппаратные серверы,server-vm:Виртуальные серверы,cluster:Кластеры,lun:LUN,storage-systems:Системы хранения,storage-vm:СХД - виртуальные тома"

sessionon = true
sessionname = "loadmon911"
sessiongmaxlifetime = 7200
sessioncookielifetime = 7200
