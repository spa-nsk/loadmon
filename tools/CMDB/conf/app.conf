appname = cmdb-web
httpport = 8080
runmode = dev
autorender = true
copyrequestbody = true
EnableXSRF = true
XSRFExpire = 3600
# Ключ подписи XSRF-токенов. Для test/prod задайте свой (CMDB_XSRFKEY): токены с ключом по умолчанию можно подделать.
XSRFKey = cmdb-dev-xsrf-key-change-me
EnableDocs = false

# search_path определяет порядок разрешения нерефлектированных схем; таблицы адресуются
# полным именем (ref.*, cmdb.*, hist.*, audit.*, imp.*, rpt.*, auth.*) в repo/models.
sqlconn = postgres://cmdb:cmdb@127.0.0.1:5432/cmdb?sslmode=disable&search_path=public
db_max_open_conns = 20
db_max_idle_conns = 5

log_level = info

# Значения выше — дефолты для локальной разработки. В test/prod переопределяются секциями
# ниже, а любой ключ можно перекрыть переменной окружения CMDB_<KEY_В_ВЕРХНЕМ_РЕГИСТРЕ>
# (см. internal/platform/config) — это единственный механизм override, который умеет
# читать этот проект: сам beego ini-парсер переменные окружения не подставляет.

[dev]
runmode = dev

[test]
runmode = test
sqlconn = postgres://cmdb:cmdb@127.0.0.1:5432/cmdb_test?sslmode=disable

[prod]
runmode = prod
