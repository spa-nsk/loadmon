syntax = "proto3";

import "google/protobuf/timestamp.proto";

option go_package = "loadmon/protocol";

package protocol;

service Loadmon {
  //Vsphere
  rpc GetVCenters (VCReq) returns (stream VCenter){} //
  rpc GetDatacenter(DCReq) returns (stream Datacenter){} //
  rpc GetCluster(CLReq) returns (stream ClusterShort){} //
  rpc GetClusterMedium(CLReq) returns (stream Cluster){} //
  rpc GetClusterMetrics(CLReq) returns (stream CLPerf){} //
  rpc GetClusterFull(CLReq) returns (stream ClusterFull){} //
  rpc GetClusterStorages(CLReq) returns (stream Datastore){} //
  rpc GetClusterHost(CLReq) returns (stream Host){} //
  rpc GetHostFull(HSReq) returns (stream HostFull){} //
  rpc GetVMByKey (VMReqKey) returns (VMPoint) {} //
  rpc GetVMsSliceByKeyList (VMListKey) returns (VMPointSlice) {} //
  rpc GetVMStreamByKeyList (VMListKey) returns (stream VMPoint) {} //
  rpc GetVMShortByKey (VMReqKey) returns (VMPointShort) {} //
  rpc GetVMListKey (VMReqListKey) returns (VMListKey) {} //
  rpc GetHostListKey (HSReqListKey) returns (HSListKey) {} //
  rpc GetClusterListKey (CLReqListKey) returns (CLListKey) {} //
  rpc GetVMListKeyByVMName (VMReqVMName) returns (VMListKey) {} //
  rpc GetVMListKeyByCluster (VMReqCluster) returns (VMListKey) {} //
  rpc GetVMListKeyByVcenter (VMReqVcenter) returns (VMListKey) {} //
  rpc GetVMListKeyByDatacenter (VMReqDatacenter) returns (VMListKey) {} //
  rpc GetVMPerfByKey(VMReqKey) returns (VMPerfSlice){} //
  rpc GetVMFiles(VMReqKey) returns(VMFileSlice){} //
  rpc GetVMGuestDiskInfo(VMReqKey) returns(GuestDiskSlice){} //
  rpc GetVMUsageOnDatastore(VMReqKey) returns (VMUsageOnDatastoreSlice) {} //
  rpc GetHostPerf(HSReqKey) returns (stream HSPerf) {} //
  rpc GetHostPerfByKey(HSReqKey) returns (HSPerfSlice) {} //
  rpc GetClusterPerfByKey(CLReqKey) returns (CLPerfSlice) {} //
  rpc GetHostByKey(HSReqKey) returns (Host) {} //
  rpc GetHostBySN(SerialNumber) returns (Host) {} //
  rpc GetClusterByKey(CLReqKey) returns (Cluster) {} //
  rpc GetDSData(KeyString) returns (Datastore) {} //
  rpc GetAllDSData(KeyString) returns (stream Datastore) {} //
  rpc ClearMetric(Duration) returns (StatusWork) {} //
  rpc ClearMetricByKey(ClearMetricKey) returns (StatusWork) {} //
  rpc ClearAllMetricByKey(ClearMetricKey) returns (StatusWork) {} //
  //HP One View
  rpc GetServerHardwareBySN(SerialNumber) returns (ServerHardware) {} //
  rpc GetServerHardwareByName(ServerName) returns (ServerHardware) {} //
  rpc GetServerHardwareByVirtualSN(SerialNumber) returns (ServerHardware) {} //
  rpc GetServerHardwareList(HWReq) returns (stream ServerHardware) {} //
  // rpc GetDatacenter(HWReq) returns (stream ) {} //TODO
  //all service
  rpc RegisterWorkProcess(RegisterEndpoint) returns (StatusWork) {}
  rpc GetClusterSprRecords(EndpointReq) returns (stream RegisterEndpoint) {}
}
//
message EndpointReq {
  string Vcenter=1;
  string OneView=2;
}

//
message RegisterEndpoint{
  string GRPCSrvApiAddr=1;
  int64 GRPCSrvApiPort=2;
  string GRPCSrvDBAddr=3;
  int64 GRPCSrvDBPort=4;
  repeated VCenter VCenter=5;
  repeated OV OneView=6;
}

//
message HWReq {
  string DatacenterName=1;
  string RackName=2;
  string PowerState=3;
  string Status=4;
  string MaintenanceMode=5;
}

//
message ClearMetricKey{
  string Vcenter=1;
