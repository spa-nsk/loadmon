  string LunType = 4; //"disk"
  string Vcenter = 5; //
  string Datacenter = 6; //
  string Cluster = 7; //
  string DisplayName = 8; //"DGC Fibre Channel Over Ethernet Disk (naa.600601602b4045005dad03...+11 more"
}

