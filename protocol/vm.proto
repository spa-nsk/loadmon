  int32 Socket=2;
}

// Hpe - состояние модуля памяти DIMMStatus в нормальном состоянии в значении "GoodInUse", MinimumVoltageVoltsX10 - напряжение питания в вольтах
message Hpe {
  string DIMMStatus=1;
  int32 MinimumVoltageVoltsX10=2;
}

// OemMemory - дополнения от производителя
message OemMemory {
  Hpe Hpe=1;
}

//
message MemoryModule {
  string BaseModuleType=1;
  int32 CapacityMiB=2;
  string DeviceLocator=3;
  string Manufacturer=4;
  string MemoryDeviceType=5;
  MemoryLocation MemoryLocation=6; //расположение модуля памяти
  string Name=7;
  OemMemory Oem=8; //дополнения от производителя
  int32 OperatingSpeedMhz=9;
  string PartNumber=10;
  int32 RankCount=11;
  MemoryStatus Status=12; //MemoryStatus - состояние модуля памяти Health в значении "OK", State в значении "Enabled"
}

//
message ServerHardwareLocalStorage {
  string URI=1;
  string CollectionState=2;
  google.protobuf.Timestamp Modified=3;
  repeated LocalStorage Data=4;
  string Etag=5;
  int32 Count=6;
  string Name=7;
}

// Status - состояние Health "OK", State "Enabled"
message Status{
  string Health=1;
  string State=2;
}

//
message LocalStorage {
  string              AdapterType=1;             //тип адаптера "SmartArray"
  int32               CacheMemorySizeMiB=2;      //размер кэша контроллера в мегабайтах
  string              CacheModuleSerialNumber=3; //серийный номер контроллера
  CacheModuleStatus   CacheModuleStatus=4;       //состояние кэша
  ControllerBoard     ControllerBoard=5;
  bool                EncryptionCspTestPassed=6; //результат тестового прохода
  bool                EncryptionEnabled=7;       //шифрование включено?
  bool                EncryptionSelfTestPassed=8; //результата теста шифрования
  FirmwareVersion     FirmwareVersion=9;         //прошивка
  string              Location=10;               //расположение "Slot 3"
  repeated LocalLogicalDrive LogicalDrives=11;    //томы (логические диски)
  string              Model=12;                  //модель "Smart Array p840 Controller"
  string              Name=13;                   //наименование "Controller in Slot 3"
  repeated LocalPhysicalDrive PhysicalDrives=14;  //диски подключенные к хранилищу
  string              SerialNumber=15;           //серийный номер
  Status              Status=16;                 //состояние
  repeated LocalStorageEnclosure StorageEnclosures=17; //корзины для дисков
}

//
message CacheModuleStatus {
  string Health=1;
}

//
message ControllerBoard {
  ControllerSatus Status=1;
}

//
message ControllerSatus {
  string Health=1;
  string State=2;
}

// Version - версия в виде строки VersionString
message Version{
  string VersionString=1;
}

// FirmwareVersion - текущая версия Firmware
message FirmwareVersion {
  Version Current=1;
}

// LogicalDataDrive - описание диска в логическом томе
message LogicalDataDrive {
  double          CapacityMiB=1;          //емкость диска в мегабайтах
  repeated string DiskDriveStatusReasons=2; //стаатусы "None"
  string          DiskDriveUse=3;         //использование диска в томе "Data"
  bool            EncryptedDrive=4;       //включено ли шифрование true, false
  FirmwareVersion FirmwareVersion=5;      //текущая версия прошивки
  string          Location=6;             //расположение "11:1:7"
  string          LocationFormat=7;       //формат строки расположения "ControllerPort:Box:Bay"
  string          MediaType=8;            //тип диска "HDD", ...
  string          Model=9;                //модель "MB4000JVYZQ"
  string          SerialNumber=10;        //серийный номер "ZC17LE2X"
  Status          Status=11;              //состояние
}

// LocalLogicalDrive - описание тома
message LocalLogicalDrive {
  double                CapacityMiB=1;            //емкость в мегабайтах
  repeated LogicalDataDrive DataDrives=2;         //диски
  bool                  LogicalDriveEncryption=3; //шифрование
  int32                 LogicalDriveNumber=4;     //номер логического диска
  string                LogicalDriveType=5;       //тип логического диска
  string                Raid=6;                   //уровень Raid "5", ...
  Status                Status=7;                 //состояние
}

// LocalPhysicalDrive - описание диска
message LocalPhysicalDrive {
  double          CapacityMiB=1;          //емкость
  repeated string DiskDriveStatusReasons=2; //стаатусы "None"
  string          DiskDriveUse=3;         //использование диска в томе "Data"
  bool            EncryptedDrive=4;       //включено ли шифрование true, false
  FirmwareVersion FirmwareVersion=5;      //текущая версия прошивки
  string          Location=6;             //расположение "11:1:7"
  string          LocationFormat=7;       //формат строки расположения "ControllerPort:Box:Bay"
  string          MediaType=8;            //тип диска "HDD", ...
  string          Model=9;                //модель "MB4000JVYZQ"
  string          SerialNumber=10;        //серийный номер "ZC17LE2X"
  Status          Status=11;              //состояние
}

// LocalStorageEnclosure - описание корзины для дисков
message LocalStorageEnclosure {
  int32           DriveBayCount=1;        //количество мест
  FirmwareVersion FirmwareVersion=2;      //версия прошивки
  string          Location=3;             //расположение "1I:1"
  string          LocationFormat=4;       //формат расположения "ControllerPort:Box"
  Status          Status=5;               //состояние
}

