message ClusterPerf{
  int64               Id = 1;
  int64               ClusterId = 2;             //ссылка на запись в ClusterRecord
  google.protobuf.Timestamp Start = 3;
  double              Cpu_usage = 4;
  double              Mem_usage = 5;
  double              Disk_usage = 6;            //скорость диска kbps
  double              Disk_totalReadLatency = 7; //Среднее время чтения с виртуального диска
  double              Disk_totalWriteLatency = 8;//Среднее время записи на виртуальный диск
  double              Disk_write = 9;            //Скорость записи данных на виртуальный диск kbps
  double              Disk_read = 10;            //Скорость чтения данных с виртуального диска kbps
  double              Net_usage = 11;            //Использование сети (комбинированные скорости передачи и скорости приема) в течение интервала kbps
  double              Net_received = 12;         //Использование сети (скорость приема) в течение интервала kbps
  double              Net_transmitted = 13;      //Использование сети (скорость передачи) в течение интервала kbps
}

